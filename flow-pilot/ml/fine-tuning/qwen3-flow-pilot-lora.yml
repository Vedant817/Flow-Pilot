# Template config for Axolotl/QLoRA-style fine-tuning.
# Fill paths and hardware settings after creating reviewed JSONL datasets.
base_model: Qwen/Qwen3-8B
model_type: AutoModelForCausalLM
tokenizer_type: AutoTokenizer
is_qwen_derived_model: true
load_in_4bit: true
strict: false

datasets:
  - path: ml/fine-tuning/datasets/train.jsonl
    type: chat_template
val_set_size: 0.1
output_dir: artifacts/qwen3-flow-pilot-lora

sequence_len: 4096
sample_packing: true
pad_to_sequence_len: true

adapter: qlora
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target_linear: true

micro_batch_size: 1
gradient_accumulation_steps: 16
num_epochs: 3
optimizer: paged_adamw_8bit
learning_rate: 0.0002
lr_scheduler: cosine
warmup_ratio: 0.03

bf16: auto
fp16: false
gradient_checkpointing: true
logging_steps: 10
saves_per_epoch: 1
